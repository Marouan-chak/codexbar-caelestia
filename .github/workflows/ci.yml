name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq qt6-declarative-dev-tools

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/codexbar-usage.sh

      - name: ShellCheck
        run: shellcheck -x install.sh scripts/codexbar-usage.sh

      - name: Python syntax
        run: python3 -m py_compile patches/apply.py

      - name: Example config parses
        run: jq -e . config.example.json > /dev/null

      - name: QML syntax
        run: |
          for f in qml/*.qml scripts/probe-entries.qml; do
            qmllint --compiler disable "$f" 2>&1 | grep -iE '^.*:[0-9]+:[0-9]+: (error|Syntax)' && exit 1
          done
          echo "no QML syntax errors"

      - name: Tests
        run: python3 -m unittest discover -s tests -v
