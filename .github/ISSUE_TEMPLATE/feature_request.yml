name: Feature request
description: Suggest an addition or a change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried
      description: Config keys, a local patch, a different tool.
